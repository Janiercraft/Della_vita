services:
  postgres-pruebas:
    image: postgres:17
    environment:
      POSTGRES_DB: beneficiarios
      POSTGRES_USER: beneficiarios
      POSTGRES_PASSWORD: 123
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beneficiarios -d beneficiarios"]
      interval: 3s
      timeout: 3s
      retries: 20
  pruebas:
    build:
      context: .
      dockerfile: Dockerfile.pruebas
    environment:
      TEST_DB_URL: jdbc:postgresql://postgres-pruebas:5432/beneficiarios
      TEST_DB_USER: beneficiarios
      TEST_DB_PASSWORD: 123
    depends_on:
      postgres-pruebas:
        condition: service_healthy
