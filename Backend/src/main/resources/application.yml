server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: gestion-beneficiarios
  profiles:
    # Al ejecutar ProyectoApplication desde VS Code sin indicar perfil,
    # Spring usara automaticamente application-local.yml.
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

application:
  api:
    path: /api/v1
  importacion:
    max-filas: 10000
  jwt:
    secret: ${JWT_SECRET:desarrollo-jwt-secret-uraba-pais-2026-cambiar-produccion-123456789}
    expiracion-minutos: ${JWT_EXPIRATION_MINUTES:120}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    modelo: ${GEMINI_MODEL:gemini-3.6-flash}
    url: ${GEMINI_URL:https://generativelanguage.googleapis.com}

logging:
  pattern:
    level: '%5p [solicitud:%X{solicitudId}]'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
